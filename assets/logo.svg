<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" fill="none">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b45309"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b45309"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#b45309" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Emblem Container (Squircle) -->
    <rect x="8" y="8" width="74" height="74" rx="22" fill="url(#grad1)" filter="url(#shadow)"/>
    
    <!-- Emblem Motif -->
    <g transform="translate(0, 0)">
        
        <!-- Chef Hat & Flame -->
        <path d="M35 68 H65 V58 H35 Z" fill="white"/>
        <path d="M32 58 C25 50 30 38 40 38 C42 30 58 30 60 38 C70 38 75 50 68 58 Z" fill="white" opacity="0.95"/>
        <circle cx="50" cy="46" r="4" fill="url(#grad2)"/>
    
    </g>

    <!-- Monogram Initial Corner Accent -->
    <circle cx="68" cy="22" r="11" fill="white" filter="url(#shadow)"/>
    <text x="68" y="26" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">G</text>

    <!-- Wordmark Typography -->
    <text x="96" y="44" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
        Ghazipur Sweets
    </text>
    <text x="96" y="64" font-family="'Plus Jakarta Sans', sans-serif, system-ui" font-size="11" font-weight="600" fill="#b45309" letter-spacing="1.2">
        FOOD & BEVERAGE
    </text>
</svg>